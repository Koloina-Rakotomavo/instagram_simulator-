name: Vérification du simulateur
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester le Worker
        run: node --test test_worker.mjs
      - name: Vérifier le simulateur mobile
        run: node --test test_frontend.mjs
